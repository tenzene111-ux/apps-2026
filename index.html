<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Reelflix — Short Drama</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div id="app">

    <!-- HOME -->
    <section id="view-home" class="view active">
      <header class="topbar">
        <h1 class="logo">Reel<span>flix</span></h1>
        <button class="coin-pill" data-open="coinModal">
          <span class="coin-icon">🪙</span><span data-coin-balance>0</span>
        </button>
      </header>
      <nav class="genre-tabs">
        <button class="genre-tab active" data-genre="all">For You</button>
        <button class="genre-tab" data-genre="romance">Romance</button>
        <button class="genre-tab" data-genre="revenge">Revenge</button>
        <button class="genre-tab" data-genre="fantasy">Fantasy</button>
      </nav>
      <div class="feed" id="feed"></div>
    </section>

    <!-- SERIES DETAIL -->
    <section id="view-detail" class="view">
      <header class="detail-header">
        <button class="icon-btn" data-back="home">←</button>
        <button class="coin-pill" data-open="coinModal">
          <span class="coin-icon">🪙</span><span data-coin-balance>0</span>
        </button>
      </header>
      <div class="detail-hero" id="detailHero">
        <div class="detail-hero-overlay">
          <h2 id="detailTitle"></h2>
          <p id="detailMeta"></p>
          <p id="detailDesc"></p>
          <div class="detail-actions">
            <button class="btn-primary" id="playFirstBtn">▶ Play Episode 1</button>
            <button class="btn-ghost" id="followBtn">+ Follow</button>
          </div>
        </div>
      </div>
      <div class="episode-grid" id="episodeGrid"></div>
    </section>

    <!-- IMMERSIVE PLAYER -->
    <section id="view-player" class="view">
      <div class="player-feed" id="playerFeed"></div>
    </section>

    <!-- MY LIST -->
    <section id="view-mylist" class="view">
      <header class="topbar"><h1 class="logo">My List</h1></header>
      <div class="feed" id="mylistFeed"></div>
    </section>

    <!-- MINE / PROFILE -->
    <section id="view-mine" class="view">
      <header class="topbar"><h1 class="logo">Mine</h1></header>
      <div class="mine-view">
        <div class="mine-header">
          <div class="mine-avatar">R</div>
          <div>
            <div style="font-weight:800;font-size:16px;">Guest Viewer</div>
            <div style="color:var(--text-dim);font-size:12.5px;">Tap to sign in for backups</div>
          </div>
        </div>
        <div class="mine-stats">
          <div><b data-coin-balance>0</b><span>Coins</span></div>
          <div><b id="mineUnlocked">0</b><span>Unlocked</span></div>
          <div><b id="mineFollowed">0</b><span>Following</span></div>
        </div>
        <div class="mine-row"><span>🪙 Recharge Coins</span><button data-open="coinModal">Top up ›</button></div>
        <div class="mine-row"><span>⭐ VIP Membership</span><button>Coming soon ›</button></div>
        <div class="mine-row"><span>⚙️ Settings</span><button>›</button></div>
        <div class="mine-row"><span>💬 Support</span><button>›</button></div>
      </div>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-tab="discover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2l-2 5.6-5.6 2 2-5.6z"/></svg>
        <span>Discover</span>
      </button>
      <button class="nav-item" data-tab="mylist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
        <span>My List</span>
      </button>
      <button class="nav-item" data-tab="mine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
        <span>Mine</span>
      </button>
    </nav>

    <div class="toast" id="toast"></div>
  </div>

  <!-- MODALS -->
  <div class="modal-backdrop" id="coinModal">
    <div class="modal">
      <h3>Recharge Coins</h3>
      <p>Coins unlock episodes across every series.</p>
      <div class="coin-packages" id="coinPackages"></div>
      <button class="modal-close" data-close="coinModal">✕</button>
    </div>
  </div>

  <div class="modal-backdrop" id="commentModal">
    <div class="modal modal-comments">
      <h3>Comments</h3>
      <div class="comment-list" id="commentList"></div>
      <div class="comment-input-row">
        <input id="commentInput" placeholder="Add a comment..." />
        <button id="commentSendBtn">Send</button>
      </div>
      <button class="modal-close" data-close="commentModal">✕</button>
    </div>
  </div>

  <div class="modal-backdrop" id="shareModal">
    <div class="modal">
      <h3>Share this episode</h3>
      <div class="share-row">
        <button class="share-btn">📋 Copy Link</button>
        <button class="share-btn">💬 Message</button>
        <button class="share-btn">📷 Instagram</button>
        <button class="share-btn">🐦 X</button>
      </div>
      <button class="modal-close" data-close="shareModal">✕</button>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
